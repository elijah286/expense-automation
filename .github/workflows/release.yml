# Build macOS + Windows installers and publish as a GitHub Release.
# Triggered by pushing a version tag: git tag v1.0.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build app and disk image
        run: ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Expense Automator.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app with PyInstaller
        run: .\packaging\build_windows.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc packaging\ExpenseAutomator.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\ExpenseAutomator_Setup.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-dmg/Expense Automator.dmg
            artifacts/windows-installer/ExpenseAutomator_Setup.exe
