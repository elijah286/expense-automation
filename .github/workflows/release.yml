# Build macOS + Windows installers and publish as a GitHub Release.
# Triggered by pushing a version tag: git tag v1.0.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build app and disk image
        run: ./packaging/build_macos.sh
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Expense Automator.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app with PyInstaller
        run: .\packaging\build_windows.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc packaging\ExpenseAutomator.iss
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExpenseAutomator_Setup.exe
