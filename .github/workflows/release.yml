# Build macOS + Windows installers and publish as a GitHub Release.
# Triggered by pushing a version tag: git tag v1.0.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build app and disk image
        run: ./packaging/build_macos.sh
      - name: Add stable download filename
        run: cp "dist/Expense.Automator.$(cat VERSION).dmg" "dist/Expense Automator.dmg"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Expense.Automator.*.dmg
            dist/Expense Automator.dmg
          make_latest: true
          body: ${{ github.event.head_commit.message }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app with PyInstaller
        run: .\packaging\build_windows.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc packaging\ExpenseAutomator.iss
      - name: Add stable download filename
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item "dist\ExpenseAutomator_Setup_$version.exe" "dist\ExpenseAutomator_Setup.exe"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ExpenseAutomator_Setup_*.exe
            dist/ExpenseAutomator_Setup.exe
          make_latest: true
          body: ${{ github.event.head_commit.message }}
